<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mega Konkurs</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --g1: #FF6B6B;
    --g2: #C850C0;
    --g3: #4158D0;
    --gradient: linear-gradient(135deg, #FF6B6B 0%, #C850C0 50%, #4158D0 100%);
    --gradient-soft: linear-gradient(135deg, rgba(255,107,107,0.1) 0%, rgba(200,80,192,0.1) 50%, rgba(65,88,208,0.1) 100%);
    --bg: #F8F7FF;
    --card: #FFFFFF;
    --text: #1A1035;
    --text-muted: #7B6F9E;
    --border: #EDE8F8;
    --shadow: 0 8px 32px rgba(200,80,192,0.1);
    --radius: 22px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }

  .nav {
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(255,255,255,0.97);
    backdrop-filter:blur(24px);
    border-top:1px solid var(--border);
    display:flex; z-index:100;
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -4px 20px rgba(200,80,192,0.08);
  }
  .nav-btn {
    flex:1; display:flex; flex-direction:column; align-items:center;
    padding:10px 0; gap:4px; cursor:pointer; transition:all 0.25s;
    border:none; background:none; color:var(--text-muted);
  }
  .nav-btn.active { color:#C850C0; }
  .nav-icon {
    width:42px; height:42px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; transition:all 0.25s;
  }
  .nav-btn.active .nav-icon { background:var(--gradient-soft); transform:scale(1.08); }
  .nav-label { font-size:10px; font-weight:600; letter-spacing:0.3px; }

  .page { display:none; padding:16px 16px 96px; animation:fadeUp 0.3s ease; }
  .page.active { display:block; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .page-header {
    font-family:'Unbounded',sans-serif; font-size:20px; font-weight:700;
    color:var(--text); margin-bottom:18px; letter-spacing:-0.5px;
  }

  /* HERO */
  .hero-card {
    background:var(--gradient); border-radius:var(--radius);
    padding:26px 22px; color:white; position:relative; overflow:hidden;
    margin-bottom:14px; box-shadow:0 12px 40px rgba(200,80,192,0.35);
  }
  .hero-card::before { content:'🎁'; position:absolute; top:-8px; right:14px; font-size:88px; opacity:0.13; transform:rotate(12deg); }
  .hero-card::after { content:''; position:absolute; bottom:-50px; left:-50px; width:160px; height:160px; background:radial-gradient(circle,rgba(255,255,255,0.15) 0%,transparent 70%); border-radius:50%; }
  .hero-badge {
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.3);
    border-radius:50px; padding:5px 12px; font-size:11px; font-weight:600;
    margin-bottom:12px; backdrop-filter:blur(10px);
  }
  .hero-name { font-family:'Unbounded',sans-serif; font-size:18px; font-weight:700; margin-bottom:20px; line-height:1.35; position:relative; z-index:1; }
  .hero-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; position:relative; z-index:1; }
  .hero-stat { background:rgba(255,255,255,0.18); border-radius:16px; padding:14px 8px; text-align:center; backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.25); }
  .hero-stat-val { font-family:'Unbounded',sans-serif; font-size:22px; font-weight:900; line-height:1; margin-bottom:5px; }
  .hero-stat-label { font-size:10px; opacity:0.8; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }

  /* CARD */
  .card { background:var(--card); border-radius:var(--radius); padding:18px; margin-bottom:12px; box-shadow:var(--shadow); border:1px solid var(--border); }
  .card-title { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:14px; }
  .info-row { display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border); }
  .info-row:last-child { border-bottom:none; }
  .info-label { font-size:14px; color:var(--text-muted); display:flex; align-items:center; gap:8px; }
  .info-value { font-size:14px; font-weight:600; color:var(--text); }
  .rank-badge { display:inline-flex; align-items:center; gap:6px; background:var(--gradient); color:white; border-radius:50px; padding:6px 14px; font-family:'Unbounded',sans-serif; font-size:12px; font-weight:700; box-shadow:0 4px 14px rgba(200,80,192,0.4); }

  /* COUNTDOWN */
  .countdown-card { background:var(--gradient); border-radius:var(--radius); padding:22px; margin-bottom:14px; box-shadow:0 12px 40px rgba(200,80,192,0.3); position:relative; overflow:hidden; }
  .countdown-card::before { content:'⏰'; position:absolute; top:-5px; right:14px; font-size:80px; opacity:0.12; }
  .countdown-title { font-size:11px; font-weight:700; color:rgba(255,255,255,0.8); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:16px; }
  .countdown-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .countdown-item { background:rgba(255,255,255,0.18); border-radius:16px; padding:14px 6px; text-align:center; border:1px solid rgba(255,255,255,0.25); backdrop-filter:blur(10px); }
  .countdown-num { font-family:'Unbounded',sans-serif; font-size:26px; font-weight:900; color:white; line-height:1; margin-bottom:5px; }
  .countdown-label { font-size:9px; color:rgba(255,255,255,0.75); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }

  /* REFERAL */
  .ref-hero { background:var(--gradient); border-radius:var(--radius); padding:22px; margin-bottom:14px; color:white; box-shadow:0 12px 40px rgba(200,80,192,0.3); position:relative; overflow:hidden; }
  .ref-hero::before { content:'🔗'; position:absolute; top:-5px; right:14px; font-size:80px; opacity:0.12; }
  .ref-hero-title { font-size:11px; font-weight:700; color:rgba(255,255,255,0.8); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:10px; }
  .ref-link-box { background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.3); border-radius:14px; padding:12px 14px; font-size:12px; color:white; word-break:break-all; margin:10px 0 6px; font-weight:500; cursor:pointer; backdrop-filter:blur(10px); line-height:1.5; }
  .ref-hint { font-size:11px; color:rgba(255,255,255,0.65); text-align:center; }

  /* BTN */
  .btn { width:100%; padding:16px; border-radius:16px; border:none; font-family:'Inter',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-gradient { background:var(--gradient); color:white; box-shadow:0 6px 20px rgba(200,80,192,0.4); }
  .btn-gradient:active { transform:scale(0.97); }
  .btn-outline { background:white; color:var(--text); border:1.5px solid var(--border); }
  .btn-outline:active { transform:scale(0.97); }

  /* TOP */
  .top-list { display:flex; flex-direction:column; gap:8px; }
  .top-item { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:16px; padding:12px 14px; border:1px solid var(--border); }
  .top-item.me { background:var(--gradient-soft); border-color:rgba(200,80,192,0.3); box-shadow:0 4px 16px rgba(200,80,192,0.12); }
  .top-rank { font-family:'Unbounded',sans-serif; font-size:12px; font-weight:700; color:var(--text-muted); min-width:30px; text-align:center; }
  .top-avatar { width:38px; height:38px; border-radius:50%; background:var(--gradient); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; box-shadow:0 4px 10px rgba(200,80,192,0.3); }
  .top-name { flex:1; font-size:13px; font-weight:500; color:var(--text); }
  .top-points { font-family:'Unbounded',sans-serif; font-size:12px; font-weight:700; background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

  /* TOAST */
  .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-80px); background:var(--gradient); color:white; padding:12px 24px; border-radius:50px; font-size:14px; font-weight:600; z-index:999; transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1); white-space:nowrap; box-shadow:0 8px 24px rgba(200,80,192,0.4); }
  .toast.show { transform:translateX(-50%) translateY(0); }

  .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; height:200px; gap:16px; color:var(--text-muted); }
  .spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:#C850C0; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .no-contest { text-align:center; padding:50px 20px; color:var(--text-muted); }
  .no-contest-icon { font-size:52px; margin-bottom:14px; }
  .no-contest-text { font-size:15px; line-height:1.7; }
  ::-webkit-scrollbar { display:none; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="page active" id="page-stats">
  <div class="page-header">📊 Statistika</div>
  <div id="stats-content"><div class="loading"><div class="spinner"></div><span>Yuklanmoqda...</span></div></div>
</div>

<div class="page" id="page-top">
  <div class="page-header">🏆 Top 100</div>
  <div id="top-content"><div class="loading"><div class="spinner"></div><span>Yuklanmoqda...</span></div></div>
</div>

<div class="page" id="page-ref">
  <div class="page-header">🔗 Referal</div>
  <div id="ref-content"><div class="loading"><div class="spinner"></div><span>Yuklanmoqda...</span></div></div>
</div>

<div class="page" id="page-timer">
  <div class="page-header">⏰ Muddat</div>
  <div id="timer-content"><div class="loading"><div class="spinner"></div><span>Yuklanmoqda...</span></div></div>
</div>

<nav class="nav">
  <button class="nav-btn active" onclick="showPage('stats',this)">
    <div class="nav-icon">📊</div><span class="nav-label">Statistika</span>
  </button>
  <button class="nav-btn" onclick="showPage('top',this)">
    <div class="nav-icon">🏆</div><span class="nav-label">Top 100</span>
  </button>
  <button class="nav-btn" onclick="showPage('ref',this)">
    <div class="nav-icon">🔗</div><span class="nav-label">Referal</span>
  </button>
  <button class="nav-btn" onclick="showPage('timer',this)">
    <div class="nav-icon">⏰</div><span class="nav-label">Muddat</span>
  </button>
</nav>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#F8F7FF'); }

  const userId = tg?.initDataUnsafe?.user?.id || null;
  const userName = tg?.initDataUnsafe?.user?.first_name || 'Foydalanuvchi';
  const userUsername = tg?.initDataUnsafe?.user?.username || '';

  // O'zingizning Railway URL va bot username ga o'zgartiring
  const API_URL = 'https://konkursweb-production.up.railway.app/';
  const BOT_USERNAME = '@miradelkonkursbot';

  let appData = null;
  let timerInterval = null;

  function showPage(name, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    btn.classList.add('active');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function copyText(text) {
    navigator.clipboard?.writeText(text).then(() => showToast('✅ Nusxalandi!')).catch(() => {
      const el = document.createElement('textarea');
      el.value = text; document.body.appendChild(el); el.select();
      document.execCommand('copy'); document.body.removeChild(el);
      showToast('✅ Nusxalandi!');
    });
  }

  function shareLink(link) {
    if (tg) tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('🎁 MEGA KONKURS — Qatnashing va sovg\'a yuting!')}`);
  }

  async function fetchData() {
    try {
      const res = await fetch(`${API_URL}/user?user_id=${userId}`);
      if (!res.ok) throw new Error();
      appData = await res.json();
    } catch {
      appData = {
        user: { points: 0, rank: '?', referrals: 0 },
        top_users: [],
        ref_link: `https://t.me/${BOT_USERNAME}?start=ref_${userId || ''}`,
        deadline: null, contest_active: false, total_users: 0
      };
    }
    renderAll();
  }

  function renderStats() {
    const u = appData.user;
    document.getElementById('stats-content').innerHTML = `
      <div class="hero-card">
        <div class="hero-badge">🎁 MEGA KONKURS · 1-MAVSUM</div>
        <div class="hero-name">${userName}${userUsername ? '<br><span style="font-size:13px;opacity:0.75">@'+userUsername+'</span>' : ''}</div>
        <div class="hero-stats">
          <div class="hero-stat"><div class="hero-stat-val">${u.points}</div><div class="hero-stat-label">Ball</div></div>
          <div class="hero-stat"><div class="hero-stat-val">${u.rank||'?'}</div><div class="hero-stat-label">O'rin</div></div>
          <div class="hero-stat"><div class="hero-stat-val">${u.referrals}</div><div class="hero-stat-label">Referal</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">📋 Batafsil</div>
        <div class="info-row"><span class="info-label">🆔 Telegram ID</span><span class="info-value">${userId||'—'}</span></div>
        <div class="info-row"><span class="info-label">⭐ Ballar</span><span class="info-value">${u.points}</span></div>
        <div class="info-row"><span class="info-label">👥 Referallar</span><span class="info-value">${u.referrals} kishi</span></div>
        <div class="info-row"><span class="info-label">🏆 Reyting</span><span class="rank-badge">🏆 ${u.rank||'?'}-o'rin</span></div>
        <div class="info-row"><span class="info-label">👥 Jami ishtirokchi</span><span class="info-value">${appData.total_users} ta</span></div>
        <div class="info-row"><span class="info-label">🎯 Holat</span><span class="info-value" style="color:${appData.contest_active?'#10B981':'#EF4444'}">${appData.contest_active?'🟢 Faol':'🔴 Tugagan'}</span></div>
      </div>`;
  }

  function renderTop() {
    const users = appData.top_users || [];
    if (!users.length) {
      document.getElementById('top-content').innerHTML = `<div class="no-contest"><div class="no-contest-icon">🏆</div><div class="no-contest-text">Hali ishtirokchilar yo'q</div></div>`;
      return;
    }
    const medals = ['🥇','🥈','🥉'];
    const emojis = ['👑','🌟','💫','🎯','🎪','🎨','🎭','🎬','🎤','🎸','🌈','🦋','🦄','🔥','💎','🚀','⚡','🌙','☀️','🎵'];
    const items = users.map((u,i) => {
      const isMe = String(u.telegram_id) === String(userId);
      const rank = i+1;
      const medal = rank<=3 ? medals[rank-1] : rank;
      const name = (u.full_name||u.username||'Nomsiz').substring(0,20);
      return `<div class="top-item ${isMe?'me':''}">
        <div class="top-rank">${medal}</div>
        <div class="top-avatar">${emojis[i%emojis.length]}</div>
        <div class="top-name">${name}${isMe?' <span style="font-size:10px;color:#C850C0;font-weight:700;">◀ SIZ</span>':''}</div>
        <div class="top-points">${u.points} ⭐</div>
      </div>`;
    }).join('');
    document.getElementById('top-content').innerHTML = `<div class="top-list">${items}</div>`;
  }

  function renderRef() {
    const link = appData.ref_link || '';
    const refs = appData.user?.referrals || 0;
    document.getElementById('ref-content').innerHTML = `
      <div class="ref-hero">
        <div class="ref-hero-title">🔗 Sizning referal havolangiz</div>
        <div class="ref-link-box" onclick="copyText('${link}')">${link}</div>
        <div class="ref-hint">👆 Bosib nusxalash</div>
      </div>
      <div class="card">
        <div class="card-title">📊 Statistika</div>
        <div class="info-row"><span class="info-label">👥 Taklif qilganlar</span><span class="info-value">${refs} kishi</span></div>
        <div class="info-row"><span class="info-label">⭐ Referal ballari</span><span class="info-value">${refs} ball</span></div>
      </div>
      <button class="btn btn-gradient" onclick="copyText('${link}')">📋 Havolani nusxalash</button>
      <div style="height:8px"></div>
      <button class="btn btn-outline" onclick="shareLink('${link}')">📤 Do'stlarga yuborish</button>
      <div class="card" style="margin-top:12px;">
        <div class="card-title">ℹ️ Qanday ishlaydi</div>
        <div style="font-size:13px;color:var(--text-muted);line-height:2;">
          1️⃣ Havolangizni do'stlarga yuboring<br>
          2️⃣ Do'stingiz botga kirib obuna bo'ladi<br>
          3️⃣ Sizga avtomatik <b style="color:#C850C0">+1 ball</b> beriladi<br>
          4️⃣ Ko'proq taklif = Ko'proq ball = 🏆
        </div>
      </div>`;
  }

  function renderTimer() {
    const deadline = appData.deadline;
    const isActive = appData.contest_active;
    if (!deadline || !isActive) {
      document.getElementById('timer-content').innerHTML = `<div class="no-contest"><div class="no-contest-icon">${isActive?'⏳':'🏁'}</div><div class="no-contest-text">${isActive?'Konkurs muddati belgilanmagan':"Hozirda faol konkurs yo'q"}</div></div>`;
      return;
    }
    const end = new Date(deadline);
    const pad = n => String(n).padStart(2,'0');

    function tick() {
      const diff = end - new Date();
      if (diff <= 0) {
        clearInterval(timerInterval);
        document.getElementById('timer-content').innerHTML = `<div class="no-contest"><div class="no-contest-icon">🏁</div><div class="no-contest-text">Konkurs muddati tugadi!</div></div>`;
        return;
      }
      const d = Math.floor(diff/86400000);
      const h = Math.floor((diff%86400000)/3600000);
      const m = Math.floor((diff%3600000)/60000);
      const s = Math.floor((diff%60000)/1000);
      const el = document.getElementById('timer-content');
      if (!el.querySelector('.countdown-card')) {
        el.innerHTML = `
          <div class="countdown-card">
            <div class="countdown-title">⏰ Konkurs tugashiga qoldi</div>
            <div class="countdown-grid">
              <div class="countdown-item"><div class="countdown-num" id="cd-d">${pad(d)}</div><div class="countdown-label">Kun</div></div>
              <div class="countdown-item"><div class="countdown-num" id="cd-h">${pad(h)}</div><div class="countdown-label">Soat</div></div>
              <div class="countdown-item"><div class="countdown-num" id="cd-m">${pad(m)}</div><div class="countdown-label">Daqiqa</div></div>
              <div class="countdown-item"><div class="countdown-num" id="cd-s">${pad(s)}</div><div class="countdown-label">Soniya</div></div>
            </div>
          </div>
          <div class="card">
            <div class="card-title">📅 Konkurs ma'lumotlari</div>
            <div class="info-row"><span class="info-label">📅 Tugash sanasi</span><span class="info-value">${end.toLocaleDateString('uz-UZ')}</span></div>
            <div class="info-row"><span class="info-label">🕐 Vaqti</span><span class="info-value">${end.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'})}</span></div>
            <div class="info-row"><span class="info-label">👥 Ishtirokchilar</span><span class="info-value">${appData.total_users} ta</span></div>
            <div class="info-row"><span class="info-label">⭐ Sizning ballingiz</span><span class="info-value">${appData.user?.points||0}</span></div>
          </div>`;
      } else {
        document.getElementById('cd-d').textContent = pad(d);
        document.getElementById('cd-h').textContent = pad(h);
        document.getElementById('cd-m').textContent = pad(m);
        document.getElementById('cd-s').textContent = pad(s);
      }
    }
    tick();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(tick, 1000);
  }

  function renderAll() { renderStats(); renderTop(); renderRef(); renderTimer(); }
  fetchData();
</script>
</body>
</html>
